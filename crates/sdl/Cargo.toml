[package]
name = "rusty486-sdl"
description = "rusty486 desktop frontend (SDL2): window, input, audio, debugger and editor."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "rusty486"
path = "src/main.rs"

[dependencies]
rusty486-core = { path = "../core" }
rusty486-asm = { path = "../asm" }
rusty486-firmware = { path = "../firmware" }
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }
font8x8 = "0.3"
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
png = "0.18"
base64 = "0.22"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
