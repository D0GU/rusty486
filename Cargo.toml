[workspace]
resolver = "2"
members = ["crates/core", "crates/asm", "crates/sdl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kespat"]
repository = ""

[profile.dev]
# The emulator is unusably slow without optimisation, even while debugging.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
